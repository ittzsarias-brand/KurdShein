<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KurdShein Admin</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --surface-soft:#fafafa;
  --ink:#101114;
  --muted:#737780;
  --line:#e7e8eb;
  --dark:#111214;
  --dark-2:#1a1b1f;
  --success:#147a3d;
  --success-bg:#e9f7ef;
  --danger:#b42318;
  --danger-bg:#fff0ef;
  --warning:#9a6700;
  --warning-bg:#fff7df;
  --shadow-sm:0 2px 8px rgba(16,24,40,.04);
  --shadow-md:0 12px 35px rgba(16,24,40,.08);
  --shadow-lg:0 28px 80px rgba(16,24,40,.18);
  --radius:18px;
}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 100% 0,rgba(17,18,20,.035),transparent 28%),
    var(--bg);
  color:var(--ink);
}
button,input,textarea,select{font:inherit}
button{
  border:0;
  border-radius:11px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:750;
  transition:transform .18s ease,box-shadow .18s ease,background .18s ease,opacity .18s ease;
}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0)}
.primary{background:var(--dark);color:#fff;box-shadow:0 5px 14px rgba(17,18,20,.16)}
.primary:hover{background:#000}
.green{background:var(--success);color:#fff;box-shadow:0 5px 14px rgba(20,122,61,.16)}
.red{background:var(--danger);color:#fff}
.gray{background:#f0f1f3;color:#202227}
.gray:hover{background:#e6e7ea}
header{
  background:rgba(17,18,20,.96);
  color:#fff;
  position:sticky;
  top:0;
  z-index:50;
  padding:15px 0;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
  backdrop-filter:blur(14px);
}
.header-inner{
  max-width:1320px;
  margin:auto;
  padding:0 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{
  width:44px;height:44px;border-radius:13px;
  display:grid;place-items:center;
  background:#fff;color:#111214;
  font-size:21px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
}
h1{margin:0;font-size:20px;letter-spacing:-.35px}
.header-subtitle{margin-top:3px;color:#aeb1b8;font-size:11px;letter-spacing:.2px}
.container{max-width:1320px;margin:auto;padding:30px 22px 60px}
.dashboard-head{
  display:flex;justify-content:space-between;align-items:flex-end;
  gap:20px;margin-bottom:22px;
}
.dashboard-head h2{
  margin:0 0 6px;
  font-size:30px;
  letter-spacing:-.8px;
}
.dashboard-head p{margin:0;color:var(--muted);font-size:14px}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}
.stat{
  position:relative;
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow-sm);
}
.stat:after{
  content:"";
  position:absolute;
  width:90px;height:90px;
  border-radius:50%;
  right:-35px;top:-35px;
  background:#f2f3f5;
}
.stat-label{
  position:relative;
  z-index:1;
  font-size:11px;
  color:var(--muted);
  font-weight:800;
  letter-spacing:.8px;
}
.stat-value{
  position:relative;
  z-index:1;
  font-size:29px;
  line-height:1.1;
  font-weight:850;
  margin-top:8px;
  letter-spacing:-.5px;
}
.toolbar{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:20px;
  padding:12px;
  background:rgba(255,255,255,.88);
  border:1px solid var(--line);
  border-radius:15px;
  box-shadow:var(--shadow-sm);
}
.search{
  flex:1;
  min-width:240px;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:10px;
  font-size:14px;
  outline:none;
  background:var(--surface-soft);
  color:var(--ink);
}
.search:focus,input:focus,textarea:focus,select:focus{
  border-color:#9da0a7;
  box-shadow:0 0 0 3px rgba(17,18,20,.06);
}
.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:18px;
}
.card{
  position:relative;
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:12px;
  box-shadow:var(--shadow-sm);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow-md);
  border-color:#d8d9dd;
}
.card img{
  width:100%;
  height:220px;
  object-fit:cover;
  display:block;
  border-radius:13px;
  background:#f0f1f3;
}
.card h3{
  margin:14px 4px 6px;
  font-size:17px;
  letter-spacing:-.2px;
}
.meta{
  color:var(--muted);
  font-size:13px;
  line-height:1.9;
  padding:0 4px;
}
.status{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
  margin:8px 4px 0;
}
.active{background:var(--success-bg);color:var(--success)}
.inactive{background:var(--danger-bg);color:var(--danger)}
.actions{display:flex;gap:8px;margin-top:13px}
.actions button{flex:1}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(8,10,13,.66);
  backdrop-filter:blur(7px);
  z-index:100;
  overflow:auto;
  padding:22px;
}
.modal.show{display:block}
.modal-box{
  max-width:850px;
  margin:18px auto;
  background:var(--surface);
  border:1px solid rgba(255,255,255,.65);
  border-radius:22px;
  padding:27px;
  box-shadow:var(--shadow-lg);
}
.modal-box h2{
  margin:0 0 22px;
  font-size:23px;
  letter-spacing:-.4px;
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
label{font-weight:800;font-size:12px;color:#3d4148}
input,textarea,select{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--line);
  border-radius:10px;
  outline:none;
  background:#fff;
  color:var(--ink);
}
textarea{min-height:105px;resize:vertical}
.modal-actions{display:flex;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.modal-actions button{flex:1}
@media(max-width:800px){
  .stats{grid-template-columns:1fr}
  .dashboard-head{align-items:flex-start;flex-direction:column}
}
@media(max-width:650px){
  .container{padding:22px 14px 45px}
  .header-inner{padding:0 14px}
  .header-inner>.gray{padding:9px 11px;font-size:12px}
  .dashboard-head h2{font-size:25px}
  .toolbar button{width:100%}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .modal{padding:9px}
  .modal-box{padding:19px;margin:5px auto;border-radius:18px}
  .products{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">🛍️</div>
      <div>
        <h1>KurdShein Admin</h1>
        <div class="header-subtitle">Product management dashboard</div>
      </div>
    </div>
    <button class="gray" onclick="openAdd()">➕ بەرهەمی نوێ</button>
  </div>
</header>

<div class="container">

  <div class="dashboard-head">
    <div>
      <h2>Product Management</h2>
      <p>Manage your catalog, inventory and product information.</p>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">TOTAL PRODUCTS</div>
      <div class="stat-value" id="totalProducts">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">ACTIVE PRODUCTS</div>
      <div class="stat-value" id="activeProducts">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">LOW STOCK</div>
      <div class="stat-value" id="lowStockProducts">0</div>
    </div>
  </div>

  <div class="toolbar">
    <input
      id="search"
      class="search"
      placeholder="گەڕان بە ناوی بەرهەم..."
      oninput="renderProducts()"
    >
    <button class="green" onclick="publishProducts()">💾 نوێکردنەوەی products.json</button>
    <button class="gray" onclick="downloadJSON()">⬇️ داگرتنی products.json</button>
    <button class="gray" onclick="loadProducts()">🔄 نوێکردنەوە</button>
  </div>

  <div id="products" class="products"></div>

</div>

<div id="productModal" class="modal">
  <div class="modal-box">

    <h2 id="modalTitle">➕ بەرهەمی نوێ</h2>

    <div class="form-grid">

      <div class="field">
        <label>ID</label>
        <input id="id">
      </div>

      <div class="field">
        <label>ناوی بەرهەم</label>
        <input id="name">
      </div>

      <div class="field">
        <label>Display Name</label>
        <input id="displayName">
      </div>

      <div class="field">
        <label>نرخ</label>
        <input id="price" type="number" min="0">
      </div>

      <div class="field">
        <label>نرخی کۆن / Sale</label>
        <input id="oldPrice" type="number" min="0">
      </div>

      <div class="field">
        <label>Stock</label>
        <input id="stock" type="number" min="0">
      </div>

      <div class="field full">
        <label>Category</label>
        <input id="category" placeholder="all, new, men">
      </div>

      <div class="field full">
        <label>Colors</label>
        <input id="colors" placeholder="ڕەش, سپی, سوور">
      </div>

      <div class="field full">
        <label>Sizes</label>
        <input id="sizes" placeholder="S, M, L, XL">
      </div>

      <div class="field full">
        <label>Main Image</label>
        <input id="mainImage" placeholder="IMG_1234.jpeg">
      </div>

      <div class="field full">
        <label>Images</label>
        <textarea id="images" placeholder="IMG_1234.jpeg, IMG_1235.jpeg"></textarea>
      </div>

      <div class="field full">
        <label>وەسف</label>
        <textarea id="description"></textarea>
      </div>

      <div class="field full">
        <label>Display Description</label>
        <textarea id="displayDescription"></textarea>
      </div>

      <div class="field">
        <label>Active</label>
        <select id="active">
          <option value="true">بەردەست / پیشاندان</option>
          <option value="false">ناچالاک / شاراوە</option>
        </select>
      </div>

    </div>

    <div class="modal-actions">
      <button class="primary" onclick="saveProduct()">💾 پاشەکەوتکردن</button>
      <button class="gray" onclick="closeModal()">گەڕانەوە</button>
    </div>

  </div>
</div>

<script>
"use strict";

let products = [];
let editingIndex = -1;

async function loadProducts(){
  try{
    const response = await fetch("products.json?cache=" + Date.now());

    if(!response.ok){
      throw new Error("products.json نەدۆزرایەوە");
    }

    const data = await response.json();

    // Accept both formats:
    // 1) [ ...products... ]
    // 2) { "version": 1, "updatedAt": null, "products": [ ... ] }
    const loadedProducts = Array.isArray(data) ? data : data?.products;

    if(!Array.isArray(loadedProducts)){
      throw new Error("products.json دەبێت Array یان object ـێکی هەبێت کە products تێیدا Array بێت");
    }

    products = loadedProducts;
    renderProducts();

  }catch(error){
    document.getElementById("products").innerHTML =
      "<div class='card'><h3>❌ هەڵە</h3><p>" +
      escapeHtml(error.message) +
      "</p></div>";
  }
}

function renderProducts(){

  const total = products.length;
  const activeCount = products.filter(p => p.active !== false).length;
  const lowStock = products.filter(p => Number(p.stock || 0) <= 5).length;

  document.getElementById("totalProducts").textContent = total;
  document.getElementById("activeProducts").textContent = activeCount;
  document.getElementById("lowStockProducts").textContent = lowStock;

  const container = document.getElementById("products");
  const query = document.getElementById("search").value.trim().toLowerCase();

  const filtered = products
    .map((product,index)=>({product,index}))
    .filter(({product})=>{
      if(!query) return true;
      return String(product.name || "")
        .toLowerCase()
        .includes(query);
    });

  if(!filtered.length){
    container.innerHTML =
      "<div class='card'><h3>هیچ بەرهەمێک نەدۆزرایەوە.</h3></div>";
    return;
  }

  container.innerHTML = filtered.map(({product,index})=>{

    const image =
      product.mainImage ||
      (Array.isArray(product.images) ? product.images[0] : "");

    const active = product.active !== false;

    return `
      <div class="card">

        <img
          src="${escapeAttr(image || "")}"
          alt="${escapeAttr(product.name || "")}"
          onerror="this.style.opacity='.25'"
        >

        <h3>${escapeHtml(product.name || "بێ ناو")}</h3>

        <div class="meta">
          💰 ${Number(product.price || 0).toLocaleString()} د.ع<br>
          📦 Stock: ${Number(product.stock || 0)}<br>
          🏷️ ${escapeHtml(
            Array.isArray(product.category)
              ? product.category.join(", ")
              : ""
          )}
        </div>

        <span class="status ${active ? "active" : "inactive"}">
          ${active ? "● چالاک" : "● ناچالاک"}
        </span>

        <div class="actions">
          <button class="primary" onclick="openEdit(${index})">
            ✏️ دەستکاری
          </button>

          <button class="red" onclick="deleteProduct(${index})">
            🗑️ سڕینەوە
          </button>
        </div>

      </div>
    `;

  }).join("");
}

function openAdd(){

  editingIndex = -1;

  document.getElementById("modalTitle").textContent =
    "➕ بەرهەمی نوێ";

  clearForm();

  document.getElementById("id").value =
    "product-" + Date.now();

  document.getElementById("active").value = "true";

  document.getElementById("productModal").classList.add("show");
}

function openEdit(index){

  editingIndex = index;

  const p = products[index];

  document.getElementById("modalTitle").textContent =
    "✏️ دەستکاری بەرهەم";

  document.getElementById("id").value = p.id || "";
  document.getElementById("name").value = p.name || "";
  document.getElementById("displayName").value = p.displayName || p.name || "";
  document.getElementById("price").value = p.price ?? "";
  document.getElementById("oldPrice").value = p.oldPrice ?? "";
  document.getElementById("stock").value = p.stock ?? "";

  document.getElementById("category").value =
    Array.isArray(p.category) ? p.category.join(", ") : "";

  document.getElementById("colors").value =
    Array.isArray(p.colors) ? p.colors.join(", ") : "";

  document.getElementById("sizes").value =
    Array.isArray(p.sizes) ? p.sizes.join(", ") : "";

  document.getElementById("mainImage").value =
    p.mainImage || "";

  document.getElementById("images").value =
    Array.isArray(p.images) ? p.images.join(", ") : "";

  document.getElementById("description").value =
    p.description || "";

  document.getElementById("displayDescription").value =
    p.displayDescription || "";

  document.getElementById("active").value =
    p.active === false ? "false" : "true";

  document.getElementById("productModal").classList.add("show");
}

function saveProduct(){

  const id = document.getElementById("id").value.trim();
  const name = document.getElementById("name").value.trim();
  const mainImage = document.getElementById("mainImage").value.trim();

  if(!id || !name || !mainImage){
    alert("ID، ناوی بەرهەم و Main Image پڕ بکەرەوە.");
    return;
  }

  const images = document.getElementById("images").value
    .split(",")
    .map(x=>x.trim())
    .filter(Boolean);

  const categories = document.getElementById("category").value
    .split(",")
    .map(x=>x.trim())
    .filter(Boolean);

  const colors = document.getElementById("colors").value
    .split(",")
    .map(x=>x.trim())
    .filter(Boolean);

  const sizes = document.getElementById("sizes").value
    .split(",")
    .map(x=>x.trim())
    .filter(Boolean);

  const product = {
    id,
    name,
    displayName:
      document.getElementById("displayName").value.trim() || name,
    description:
      document.getElementById("description").value,
    displayDescription:
      document.getElementById("displayDescription").value,
    price:
      Number(document.getElementById("price").value) || 0,
    oldPrice:
      document.getElementById("oldPrice").value === ""
        ? null
        : Number(document.getElementById("oldPrice").value) || 0,
    category:
      categories.length ? categories : ["all"],
    colors,
    sizes,
    stock:
      Math.max(0, Number(document.getElementById("stock").value) || 0),
    images:
      images.length ? images : [mainImage],
    mainImage,
    active:
      document.getElementById("active").value === "true"
  };

  if(editingIndex === -1){
    products.push(product);
  }else{
    products[editingIndex] = product;
  }

  closeModal();
  renderProducts();
}

async function publishProducts(){

  if(!products.length){
    alert("هیچ بەرهەمێک نییە بۆ بڵاوکردنەوە.");
    return;
  }

  const adminPassword = prompt("وشەی نهێنی Admin بنووسە:");
  if(adminPassword === null) return;

  if(!adminPassword){
    alert("وشەی نهێنی Admin پێویستە.");
    return;
  }

  try{
    const response = await fetch("/.netlify/functions/update-products", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        products: products,
        adminPassword: adminPassword
      })
    });

    const result = await response.json().catch(()=>({}));

    if(!response.ok){
      throw new Error(result.error || "نەتوانرا products.json نوێ بکرێتەوە.");
    }

    alert("✅ products.json بە سەرکەوتوویی نوێکرایەوە.");
  }catch(error){
    alert("❌ هەڵە: " + error.message);
  }
}

function deleteProduct(index){

  const product = products[index];

  if(!confirm(
    "دڵنیایت دەتەوێت ئەم بەرهەمە بسڕیتەوە؟\n\n" +
    (product.name || "")
  )){
    return;
  }

  products.splice(index,1);
  renderProducts();
}

function downloadJSON(){

  const json = JSON.stringify(products,null,2);

  const blob = new Blob(
    [json],
    {type:"application/json;charset=utf-8"}
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download = "products.json";

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
}

function clearForm(){

  [
    "id",
    "name",
    "displayName",
    "price",
    "oldPrice",
    "stock",
    "category",
    "colors",
    "sizes",
    "mainImage",
    "images",
    "description",
    "displayDescription"
  ].forEach(id=>{
    document.getElementById(id).value = "";
  });

  document.getElementById("active").value = "true";
}

function closeModal(){
  document.getElementById("productModal").classList.remove("show");
}

function escapeHtml(value){

  return String(value ?? "").replace(
    /[&<>"']/g,
    char=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char])
  );
}

function escapeAttr(value){
  return escapeHtml(value);
}

loadProducts();
</script>

</body>
</html>
