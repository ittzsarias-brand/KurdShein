<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KurdShein Admin</title>
<style>
:root{--bg:#080a0f;--surface:#10141b;--surface2:#171c24;--text:#f8fafc;--muted:#98a2b3;--red:#e51c2a;--green:#168a46;--yellow:#f7c948;--border:rgba(255,255,255,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;padding:18px}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:900px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.head h1{margin:0;font-size:25px}.badge{padding:7px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:12px}.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:11px;outline:none}.field textarea{min-height:85px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800}.primary{background:var(--red);color:#fff}.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.danger{background:#9e2d24;color:#fff}.status{padding:10px;border-radius:10px;background:var(--surface2);color:var(--muted);margin-top:10px;font-size:12px}.product{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;padding:11px;border:1px solid var(--border);background:var(--surface2);border-radius:13px;margin-top:9px}.product img{width:80px;height:80px;object-fit:cover;border-radius:10px;background:#0b0e13}.product h3{font-size:14px;margin:0 0 5px}.meta{font-size:11px;color:var(--muted);line-height:1.8}.empty{text-align:center;color:var(--muted);padding:25px}.hidden{display:none!important}.login{max-width:430px;margin:10vh auto}.login h1{text-align:center}.small{font-size:11px;color:var(--muted);line-height:1.7;margin-top:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.product{grid-template-columns:60px 1fr}.product img{width:60px;height:60px}.product .actions{grid-column:1/-1}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="loginView" class="login card">
<h1>⚙️ KurdShein Admin</h1>
<div class="grid">
<div class="field full"><label>ئیمەیڵ</label><input id="email" type="email" autocomplete="username"></div>
<div class="field full"><label>وشەی نهێنی</label><input id="password" type="password" autocomplete="current-password"></div>
</div>
<div class="actions"><button class="btn primary" id="loginBtn">چوونەژوورەوە</button></div>
<div id="loginStatus" class="status">تکایە بە هەژماری Admin بچۆ ژوورەوە.</div>
</div>

<div id="adminView" class="wrap hidden">
<div class="head"><div><h1>⚙️ KurdShein Admin</h1><div class="small" id="who"></div></div><button class="btn secondary" id="logoutBtn">دەرچوون</button></div>
<div class="card">
<h2 id="formTitle">➕ زیادکردنی بەرهەم</h2>
<div class="grid">
<div class="field"><label>ناوی بەرهەم</label><input id="pName" required></div>
<div class="field"><label>پۆلێن</label><input id="pCategory" placeholder="electronics new sale" required></div>
<div class="field"><label>نرخ (د.ع)</label><input id="pPrice" type="number" min="0" required></div>
<div class="field"><label>نرخی کۆن (بۆ داشکاندن)</label><input id="pOldPrice" type="number" min="0"></div>
<div class="field"><label>Stock</label><input id="pStock" type="number" min="0" value="10" required></div>
<div class="field"><label>قەبارەکان</label><input id="pSizes" placeholder="S, M, L, XL"></div>
<div class="field full"><label>ڕەنگەکان</label><input id="pColors" placeholder="ڕەش، سپی، سور"></div>
<div class="field full"><label>وەسفی بەرهەم</label><textarea id="pDescription"></textarea></div>
<div class="field full"><label>لینکی وێنەکان — یەک لینک لە هەر دێڕێک یان بە | جیا بکەرەوە</label><textarea id="pImages" placeholder="IMG_1234.jpeg|IMG_1235.jpeg"></textarea></div>
<div class="field"><label>⭐ نمرە</label><input id="pRating" type="number" min="0" max="5" step="0.1" value="5"></div>
<div class="field"><label>نوێ؟</label><select id="pNew"><option value="yes">بەڵێ</option><option value="no">نەخێر</option></select></div>
</div>
<div class="actions"><button class="btn primary" id="saveBtn">زیادکردنی بەرهەم</button><button class="btn secondary hidden" id="cancelBtn">هەڵوەشاندنەوەی دەستکاری</button></div>
<div id="saveStatus" class="status">ئامادەیە.</div>
</div>
<div class="card"><h2>📦 بەرهەمە زیادکراوەکان</h2><div id="productList"><div class="empty">چاوەڕێی داتا...</div></div></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {getFirestore,collection,addDoc,getDocs,deleteDoc,doc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyCC_gLPdruLlmCZJRiWWHjbrWlFvrhbfUA",authDomain:"kurdshein-4bf9a.firebaseapp.com",projectId:"kurdshein-4bf9a",storageBucket:"kurdshein-4bf9a.firebasestorage.app",messagingSenderId:"220960680097",appId:"1:220960680097:web:6cc4a238266e9e816368e0",measurementId:"G-T5R7YJ9TQS"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let editingId=null;
const $=id=>document.getElementById(id);
const fields=['pName','pCategory','pPrice','pOldPrice','pStock','pSizes','pColors','pDescription','pImages','pRating','pNew'];
function status(text){$('saveStatus').textContent=text}
function imageList(value){return String(value||'').split(/
|\|/).map(x=>x.trim()).filter(Boolean)}
function collectForm(){const images=imageList($('pImages').value);return {name:$('pName').value.trim(),category:$('pCategory').value.trim(),price:Number($('pPrice').value)||0,oldPrice:Number($('pOldPrice').value)||0,stock:Number($('pStock').value)||0,sizes:$('pSizes').value.trim(),colors:$('pColors').value.trim(),description:$('pDescription').value.trim(),images,rating:Number($('pRating').value)||5,isNew:$('pNew').value==='yes',updatedAt:serverTimestamp()}}
function resetForm(){editingId=null;fields.forEach(id=>{if(id==='pStock')$(id).value=10;else if(id==='pRating')$(id).value=5;else if(id==='pNew')$(id).value='yes';else $(id).value=''});$('formTitle').textContent='➕ زیادکردنی بەرهەم';$('saveBtn').textContent='زیادکردنی بەرهەم';$('cancelBtn').classList.add('hidden');status('ئامادەیە.')}
function fillForm(p,id){editingId=id;$('pName').value=p.name||'';$('pCategory').value=p.category||'';$('pPrice').value=p.price??'';$('pOldPrice').value=p.oldPrice||'';$('pStock').value=p.stock??0;$('pSizes').value=p.sizes||'';$('pColors').value=p.colors||'';$('pDescription').value=p.description||'';$('pImages').value=(p.images||[]).join('|');$('pRating').value=p.rating??5;$('pNew').value=p.isNew?'yes':'no';$('formTitle').textContent='✏️ دەستکاریی بەرهەم';$('saveBtn').textContent='پاشەکەوتکردنی گۆڕانکاری';$('cancelBtn').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
async function loadProducts(){const box=$('productList');box.innerHTML='<div class="empty">چاوەڕێی داتا...</div>';try{const snap=await getDocs(collection(db,'products'));if(snap.empty){box.innerHTML='<div class="empty">هێشتا هیچ بەرهەمێکی Admin نییە.</div>';return}box.innerHTML='';snap.forEach(s=>{const p=s.data(),img=(p.images||[])[0]||'';const el=document.createElement('div');el.className='product';el.innerHTML=`<img src="${escapeHtml(img)}" onerror="this.style.visibility='hidden'"><div><h3>${escapeHtml(p.name||'بێ ناو')}</h3><div class="meta">${Number(p.price||0).toLocaleString()} د.ع · Stock: ${p.stock??0}<br>${escapeHtml(p.category||'')} · ${escapeHtml(p.sizes||'')}</div></div><div class="actions"><button class="btn secondary edit">✏️</button><button class="btn danger delete">🗑️</button></div>`;el.querySelector('.edit').onclick=()=>fillForm(p,s.id);el.querySelector('.delete').onclick=async()=>{if(confirm('ئەم بەرهەمە بسڕمەوە؟')){await deleteDoc(doc(db,'products',s.id));await loadProducts()}};box.appendChild(el)})}catch(e){box.innerHTML='<div class="empty">هەڵە لە خوێندنەوەی داتا. Firestore Rules بپشکنە.</div>';console.error(e)}}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('loginStatus').textContent='بەسەرکەوتوویی چوویتە ژوورەوە.'}catch(e){$('loginStatus').textContent='چوونەژوورەوە سەرکەوتوو نەبوو: '+e.message}}
$('logoutBtn').onclick=()=>signOut(auth);$('cancelBtn').onclick=resetForm;
$('saveBtn').onclick=async()=>{try{const p=collectForm();if(!p.name||!p.category||!p.images.length)return status('⚠️ ناو، پۆلێن و لانیکەم یەک وێنە پڕ بکەرەوە');if(editingId)await updateDoc(doc(db,'products',editingId),p);else await addDoc(collection(db,'products'),{...p,createdAt:serverTimestamp()});status('✅ بەرهەمەکە پاشەکەوتکرا');resetForm();await loadProducts()}catch(e){console.error(e);status('❌ هەڵە: '+e.message)}};
onAuthStateChanged(auth,async user=>{if(user){$('loginView').classList.add('hidden');$('adminView').classList.remove('hidden');$('who').textContent=user.email||'';await loadProducts()}else{$('loginView').classList.remove('hidden');$('adminView').classList.add('hidden')}});
</script>
</body></html>
