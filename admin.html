<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KurdShein Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}
header{
  background:#111;
  color:#fff;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}
.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}
h1{margin:0;font-size:22px}
.container{
  max-width:1200px;
  margin:25px auto;
  padding:0 15px;
}
.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
button{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
}
.primary{background:#111;color:#fff}
.green{background:#16803c;color:#fff}
.red{background:#c62828;color:#fff}
.gray{background:#ddd;color:#111}
.search{
  flex:1;
  min-width:200px;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
}
.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:15px;
}
.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  padding:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}
.card img{
  width:100%;
  height:210px;
  object-fit:cover;
  border-radius:10px;
  background:#eee;
}
.card h3{margin:12px 0 7px}
.meta{
  color:#666;
  font-size:14px;
  line-height:1.7;
}
.actions{
  display:flex;
  gap:7px;
  margin-top:12px;
}
.actions button{flex:1}
.status{
  display:inline-block;
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  margin-top:7px;
}
.active{background:#d9f5e2;color:#126b31}
.inactive{background:#ffdede;color:#9b1111}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:100;
  overflow:auto;
  padding:20px;
}
.modal.show{display:block}
.modal-box{
  max-width:800px;
  margin:20px auto;
  background:#fff;
  border-radius:15px;
  padding:22px;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-weight:bold}
input,textarea,select{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:8px;
  font:inherit;
}
textarea{min-height:100px;resize:vertical}
.modal-actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}
.modal-actions button{flex:1}

@media(max-width:650px){
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>🛍️ KurdShein Admin</h1>
    <button class="gray" onclick="openAdd()">➕ بەرهەمی نوێ</button>
  </div>
</header>

<div class="container">

  <div class="toolbar">
    <input
      id="search"
      class="search"
      placeholder="گەڕان بە ناوی بەرهەم..."
      oninput="renderProducts()"
    >
    <button class="green" onclick="downloadJSON()">💾 داگرتنی products.json</button>
    <button class="gray" onclick="loadProducts()">🔄 نوێکردنەوە</button>
  </div>

  <div id="products" class="products"></div>

</div>

<div id="productModal" class="modal">
  <div class="modal-box">

    <h2 id="modalTitle">➕ بەرهەمی نوێ</h2>

    <div class="form-grid">

      <div class="field">
        <label>ID</label>
        <input id="id">
      </div>

      <div class="field">
        <label>ناوی بەرهەم</label>
        <input id="name">
      </div>

      <div class="field">
        <label>Display Name</label>
        <input id="displayName">
      </div>

      <div class="field">
        <label>نرخ</label>
        <input id="price" type="number" min="0">
      </div>

      <div class="field">
        <label>نرخی کۆن / Sale</label>
        <input id="oldPrice" type="number" min="0">
      </div>

      <div class="field">
        <label>Stock</label>
        <input id="stock" type="number" min="0">
      </div>

      <div class="field full">
        <label>Category</label>
        <input id="category" placeholder="all, new, men">
      </div>

      <div class="field full">
        <label>Colors</label>
        <input id="colors" placeholder="ڕەش, سپی, سوور">
      </div>

      <div class="field full">
        <label>Sizes</label>
        <input id="sizes" placeholder="S, M, L, XL">
      </div>

      <div class="field full">
        <label>Main Image</label>
        <input id="mainImage" placeholder="IMG_1234.jpeg">
      </div>

      <div class="field full">
        <label>Images</label>
        <textarea id="images" placeholder="IMG_1234.jpeg, IMG_1235.jpeg"></textarea>
      </div>

      <div class="field full">
        <label>وەسف</label>
        <textarea id="description"></textarea>
      </div>

      <div class="field full">
        <label>Display Description</label>
        <textarea id="displayDescription"></textarea>
      </div>

      <div class="field">
        <label>Active</label>
        <select id="active">
          <option value="true">بەردەست / پیشاندان</option>
          <option value="false">ناچالاک / شاراوە</option>
        </select>
      </div>

    </div>

    <div class="modal-actions">
      <button class="primary" onclick="saveProduct()">💾 پاشەکەوتکردن</button>
      <button class="gray" onclick="closeModal()">گەڕانەوە</button>
    </div>

  </div>
</div>

<script>
"use strict";

let products = [];
let editingIndex = -1;

async function loadProducts(){
  try{
    const response = await fetch("products.json?cache=" + Date.now());

    if(!response.ok){
      throw new Error("products.json نەدۆزرایەوە");
    }

    const data = await response.json();

    // Accept both formats:
    // 1) [ ...products... ]
    // 2) { "version": 1, "updatedAt": null, "products": [ ... ] }
    const loadedProducts = Array.isArray(data) ? data : data?.products;

    if(!Array.isArray(loadedProducts)){
      throw new Error("products.json دەبێت Array یان object ـێکی هەبێت کە products تێیدا Array بێت");
    }

    products = loadedProducts;
    renderProducts();

  }catch(error){
    document.getElementById("products").innerHTML =
      "<div class='card'><h3>❌ هەڵە</h3><p>" +
      escapeHtml(error.message) +
      "</p></div>";
  }
}

function renderProducts(){

  const container = document.getElementById("products");
  const query = document.getElementById("search").value.trim().toLowerCase();

  const filtered = products
    .map((product,index)=>({product,index}))
    .filter(({product})=>{
      if(!query) return true;
      return String(product.name || "")
        .toLowerCase()
        .includes(query);
    });

  if(!filtered.length){
    container.innerHTML =
      "<div class='card'><h3>هیچ بەرهەمێک نەدۆزرایەوە.</h3></div>";
    return;
  }

  container.innerHTML = filtered.map(({product,index})=>{

    const image =
      product.mainImage ||
      (Array.isArray(product.images) ? product.images[0] : "");

    const active = product.active !== false;

    return `
      <div class="card">

        <img
          src="${escapeAttr(image || "")}"
          alt="${escapeAttr(product.name || "")}"
          onerror="this.style.opacity='.25'"
        >

        <h3>${escapeHtml(product.name || "بێ ناو")}</h3>

        <div class="meta">
          💰 ${Number(product.price || 0).toLocaleString()} د.ع<br>
          📦 Stock: ${Number(product.stock || 0)}<br>
          🏷️ ${escapeHtml(
            Array.isArray(product.category)
              ? product.category.join(", ")
              : ""
          )}
        </div>

        <span class="status ${active ? "active" : "inactive"}">
          ${active ? "● چالاک" : "● ناچالاک"}
        </span>

        <div class="actions">
          <button class="primary" onclick="openEdit(${index})">
            ✏️ دەستکاری
          </button>

          <button class="red" onclick="deleteProduct(${index})">
            🗑️ سڕینەوە
          </button>
        </div>

      </div>
    `;

  }).join("");
}

function openAdd(){

  editingIndex = -1;

  document.getElementById("modalTitle").textContent =
    "➕ بەرهەمی نوێ";

  clearForm();

  document.getElementById("id").value =
    "product-" + Date.now();

  document.getElementById("active").value = "true";

  document.getElementById("productModal").classList.add("show");
}

function openEdit(index){

  editingIndex = index;

  const p = products[index];

  document.getElementById("modalTitle").textContent =
    "✏️ دەستکاری بەرهەم";

  document.getElementById("id").value = p.id || "";
  document.getElementById("name").value = p.name || "";
  document.getElementById("displayName").value = p.displayName || p.name || "";
  document.getElementById("price").value = p.price ?? "";
  document.getElementById("oldPrice").value = p.oldPrice ?? "";
  document.getElementById("stock").value = p.stock ?? "";

  document.getElementById("category").value =
    Array.isArray(p.category) ? p.category.join(", ") : "";

  document.getElementById("colors").value =
    Array.isArray(p.colors) ? p.colors.join(", ") : "";

  document.getElementById("sizes").value =
    Array.isArray(p.sizes) ? p.sizes.join(", ") : "";

  document.getElementById("mainImage").value =
    p.mainImage || "";

  document.getElementById("images").value =
    Array.isArray(p.images) ? p.images.join(", ") : "";

  document.getElementById("description").value =
    p.description || "";

  document.getElementById("displayDescription").value =
    p.displayDescription || "";

  document.getElementById("active").value =
    p.active === false ? "false" : "true";

  document.getElementById("productModal").classList.add("show");
}

function saveProduct(){

  const id = document.getElementById("id").value.trim();
  const name = document.getElementById("name").value.trim();
  const mainImage = document.getElementById("mainImage").value.trim();

  if(!id || !name || !mainImage){
    alert("ID، ناوی بەرهەم و Main Image پڕ بکەرەوە.");
    return;
  }

  const images = document.getElementById("images").value
    .split(",")
    .map(x=>x.trim())
    .filter(Boolean);

  const categories = document.getElementById("category").value
    .split(",")
    .map(x=>x.trim())
    .filter(Boolean);

  const colors = document.getElementById("colors").value
    .split(",")
    .map(x=>x.trim())
    .filter(Boolean);

  const sizes = document.getElementById("sizes").value
    .split(",")
    .map(x=>x.trim())
    .filter(Boolean);

  const product = {
    id,
    name,
    displayName:
      document.getElementById("displayName").value.trim() || name,
    description:
      document.getElementById("description").value,
    displayDescription:
      document.getElementById("displayDescription").value,
    price:
      Number(document.getElementById("price").value) || 0,
    oldPrice:
      document.getElementById("oldPrice").value === ""
        ? null
        : Number(document.getElementById("oldPrice").value) || 0,
    category:
      categories.length ? categories : ["all"],
    colors,
    sizes,
    stock:
      Math.max(0, Number(document.getElementById("stock").value) || 0),
    images:
      images.length ? images : [mainImage],
    mainImage,
    active:
      document.getElementById("active").value === "true"
  };

  if(editingIndex === -1){
    products.push(product);
  }else{
    products[editingIndex] = product;
  }

  closeModal();
  renderProducts();
}

function deleteProduct(index){

  const product = products[index];

  if(!confirm(
    "دڵنیایت دەتەوێت ئەم بەرهەمە بسڕیتەوە؟\n\n" +
    (product.name || "")
  )){
    return;
  }

  products.splice(index,1);
  renderProducts();
}

function downloadJSON(){

  const json = JSON.stringify(products,null,2);

  const blob = new Blob(
    [json],
    {type:"application/json;charset=utf-8"}
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download = "products.json";

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
}

function clearForm(){

  [
    "id",
    "name",
    "displayName",
    "price",
    "oldPrice",
    "stock",
    "category",
    "colors",
    "sizes",
    "mainImage",
    "images",
    "description",
    "displayDescription"
  ].forEach(id=>{
    document.getElementById(id).value = "";
  });

  document.getElementById("active").value = "true";
}

function closeModal(){
  document.getElementById("productModal").classList.remove("show");
}

function escapeHtml(value){

  return String(value ?? "").replace(
    /[&<>"']/g,
    char=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char])
  );
}

function escapeAttr(value){
  return escapeHtml(value);
}

loadProducts();
</script>

</body>
</html>
