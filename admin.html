<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KurdShein Admin Panel</title>
  <style>
    body { font-family: sans-serif; background: #080a0f; color: #fff; padding: 20px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-size: 13px; }
    input, textarea { width: 100%; padding: 10px; background: #171c24; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; }
    button { padding: 10px 18px; background: #e51c2a; color: #fff; border: 0; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .product-list { margin-top: 30px; display: grid; gap: 10px; }
    .product-item { background: #10141b; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
    .btn-delete { background: #c0392b; }
  </style>
</head>
<body>

  <h2>⚙️ KurdShein Product Admin Panel</h2>
  <hr style="border-color: #222; margin-bottom: 20px;"><br>

  <form id="productForm">
    <div class="form-group">
      <label>Product Name (ناوی بەرهەم)</label>
      <input type="text" id="pName" required>
    </div>
    <div class="form-group">
      <label>Category (پۆلێن)</label>
      <input type="text" id="pCategory" placeholder="e.g. all new electronics" required>
    </div>
    <div class="form-group">
      <label>Price (د.ع)</label>
      <input type="number" id="pPrice" required>
    </div>
    <div class="form-group">
      <label>Stock (ژمارەی لە کۆگا)</label>
      <input type="number" id="pStock" value="10" required>
    </div>
    <div class="form-group">
      <label>Sizes (قەبارەکان)</label>
      <input type="text" id="pSizes" placeholder="S, M, L, XL">
    </div>
    <div class="form-group">
      <label>Colors (ڕەنگەکان)</label>
      <input type="text" id="pColors" placeholder="ڕەش, سپی">
    </div>
    <div class="form-group">
      <label>Image File Names (ناو و وێنەکان)</label>
      <input type="text" id="pImages" placeholder="IMG_1.jpeg|IMG_2.jpeg" required>
    </div>
    <div class="form-group">
      <label>Description (وەسف)</label>
      <textarea id="pDescription" rows="3" required></textarea>
    </div>

    <button type="submit">➕ زیاتر کردنی بەرهەم (Add Product)</button>
  </form>

  <h3 style="margin-top: 40px;">📦 Existing Products</h3>
  <div class="product-list" id="productList"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCC_gLPdruLlmCZJRiWWHjbrWlFvrhbfUA",
        authDomain: "kurdshein-4bf9a.firebaseapp.com",
        projectId: "kurdshein-4bf9a",
        storageBucket: "kurdshein-4bf9a.firebasestorage.app",
        messagingSenderId: "220960680097",
        appId: "1:220960680097:web:6cc4a238266e9e816368e0",
        measurementId: "G-T5R7YJ9TQS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("productForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const newProduct = {
        name: document.getElementById("pName").value,
        category: document.getElementById("pCategory").value,
        price: Number(document.getElementById("pPrice").value),
        stock: Number(document.getElementById("pStock").value),
        sizes: document.getElementById("pSizes").value,
        colors: document.getElementById("pColors").value,
        images: document.getElementById("pImages").value,
        description: document.getElementById("pDescription").value,
        createdAt: new Date().toISOString()
      };

      try {
        await addDoc(collection(db, "products"), newProduct);
        alert("✅ Product Added Successfully!");
        document.getElementById("productForm").reset();
        loadProducts();
      } catch (err) {
        alert("Error adding product: " + err.message);
      }
    });

    async function loadProducts() {
      const container = document.getElementById("productList");
      container.innerHTML = "Loading...";
      const querySnapshot = await getDocs(collection(db, "products"));
      container.innerHTML = "";

      querySnapshot.forEach((documentSnap) => {
        const item = documentSnap.data();
        const div = document.createElement("div");
        div.className = "product-item";
        div.innerHTML = `
          <div>
            <strong>${item.name}</strong> - ${item.price} IQD
            <br><small style="color:#888;">Category: ${item.category}</small>
          </div>
          <button class="btn-delete" onclick="deleteProduct('${documentSnap.id}')">🗑️ Delete</button>
        `;
        container.appendChild(div);
      });
    }

    window.deleteProduct = async (id) => {
      if (confirm("Are you sure you want to delete this product?")) {
        await deleteDoc(doc(db, "products", id));
        loadProducts();
      }
    };

    loadProducts();
  </script>
</body>
</html>
