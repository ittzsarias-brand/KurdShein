<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KurdShein Admin Panel</title>
  <style>
    body { font-family: sans-serif; background: #080a0f; color: #fff; padding: 20px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-size: 13px; }
    input, textarea { width: 100%; padding: 10px; background: #171c24; border: 1px solid #222; color: #fff; border-radius: 6px; }
    button { padding: 10px 18px; background: #e51c2a; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    .product-list { margin-top: 30px; display: grid; gap: 10px; }
    .product-item { background: #10141b; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .btn-delete { background: #c0392b; }
  </style>
</head>
<body>

  <h2>⚙️ KurdShein Product Admin Panel</h2>
  <hr style="border-color: #222; margin-bottom: 20px;"><br>

  <form id="productForm">
    <div class="form-group">
      <label>Product Name (ناوی بەرهەم)</label>
      <input type="text" id="pName" required>
    </div>
    <div class="form-group">
      <label>Category (پۆلێن)</label>
      <input type="text" id="pCategory" placeholder="e.g. all new electronics" required>
    </div>
    <div class="form-group">
      <label>Price (د.ع)</label>
      <input type="number" id="pPrice" required>
    </div>
    <div class="form-group">
      <label>Stock (ژمارەی لە کۆگا)</label>
      <input type="number" id="pStock" value="10" required>
    </div>
    <div class="form-group">
      <label>Sizes (قەبارەکان)</label>
      <input type="text" id="pSizes" placeholder="e.g. S, M, L, XL">
    </div>
    <div class="form-group">
      <label>Image URL (لینکی ڕەسم)</label>
      <input type="url" id="pImg" required>
    </div>
    <button type="submit">Add Product (زیادکردنی بەرهەم)</button>
  </form>

  <div class="product-list" id="productList">
    <!-- Products will appear here dynamically -->
  </div>

</body>
</html>
