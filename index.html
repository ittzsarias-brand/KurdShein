<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurd Shein | کورد شین</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --card-bg: #282828;
            --text-color: #f5f5f5;
            --text-secondary: #b3b3b3;
            --kurd-red: #E4002B;
            --kurd-white: #FFFFFF;
            --kurd-green: #008751;
            --kurd-yellow: #FFC72C;
            --border-color: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: right;
        }

        .top-bar {
            background: linear-gradient(90deg, var(--kurd-red) 0%, var(--kurd-white) 50%, var(--kurd-green) 100%);
            color: #000;
            text-align: center;
            padding: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        header {
            background-color: var(--surface-color);
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(45deg, var(--kurd-red), var(--kurd-yellow), var(--kurd-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sun-icon {
            color: var(--kurd-yellow);
            font-size: 24px;
        }

        .search-bar {
            flex: 1;
            max-width: 500px;
            margin: 0 20px;
            display: flex;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 0 20px 20px 0;
            border: 1px solid var(--border-color);
            background-color: #2b2b2b;
            color: var(--text-color);
            outline: none;
        }

        .search-bar button {
            padding: 10px 20px;
            border-radius: 20px 0 0 20px;
            border: none;
            background-color: var(--kurd-green);
            color: var(--kurd-white);
            cursor: pointer;
            font-weight: bold;
        }

        .user-actions {
            display: flex;
            gap: 20px;
            font-size: 14px;
        }

        .user-actions button {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 15px;
        }

        .cart-count {
            background-color: var(--kurd-red);
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 12px;
            margin-right: 4px;
        }

        nav {
            background-color: #181818;
            border-top: 1px solid var(--border-color);
        }

        .nav-links {
            display: flex;
            justify-content: center;
            list-style: none;
            padding: 12px 0;
            gap: 30px;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
            cursor: pointer;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--kurd-yellow);
        }

        .hero {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1200') center/cover;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-bottom: 3px solid var(--kurd-red);
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 10px;
            color: var(--kurd-white);
        }

        .hero p {
            font-size: 18px;
            color: var(--kurd-yellow);
            margin-bottom: 20px;
        }

        .shop-btn {
            background-color: var(--kurd-red);
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            border: none;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 24px;
            margin-bottom: 20px;
            border-right: 4px solid var(--kurd-green);
            padding-right: 10px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }
