<!DOCTYPE html>
<html lang="kmr" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KurdShein | کوردشین</title>

  <style>
    @font-face {
      font-family: 'Rabar';
      src: url('./Rabar_037.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      color: #ffffff;
      font-family: 'Rabar', sans-serif;
      font-weight: 700;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* --- FULL KURDISTAN FLAG BACKGROUND --- */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      /* Full Kurdistan Flag: Red, White + Sun, Green */
      background: linear-gradient(
        to bottom,
        #e41e26 0%, #e41e26 33.3%,
        #ffffff 33.3%, #ffffff 66.6%,
        #278e43 66.6%, #278e43 100%
      );
    }

    /* Golden Sun Overlay in the center of the background */
    body::after {
      content: "☀️";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 22vw;
      z-index: -2;
      opacity: 0.85;
      text-shadow: 0 0 40px rgba(254, 189, 17, 0.8);
      pointer-events: none;
    }

    /* Dark Overlay for Readability */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: -1;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(10px);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #febd11;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #fff;
    }

    .logo span {
      color: #e41e26;
    }

    .search-container {
      display: flex;
      flex-grow: 1;
      max-width: 320px;
      margin: 0 12px;
    }

    .search-container input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 0 20px 20px 0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-left: none;
      background-color: rgba(0, 0, 0, 0.6);
      color: #fff;
      outline: none;
      font-family: inherit;
      text-align: right;
    }

    .search-container button {
      padding: 8px 14px;
      border-radius: 20px 0 0 20px;
      border: 1px solid #e41e26;
      background-color: #e41e26;
      color: #fff;
      cursor: pointer;
    }

    .cart {
      font-size: 24px;
    }

    /* Categories Scrollbar */
    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.5);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }

    .category:hover, .category.active {
      background: #278e43;
      border-color: #278e43;
    }

    /* Hero Banner */
    .hero {
      padding: 30px 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.4);
      margin: 15px;
      border-radius: 16px;
      border: 1px solid rgba(254, 189, 17, 0.3);
    }

    .hero h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .hero p {
      color: #febd11;
      font-size: 14px;
    }

    /* Product Grid */
    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 15px;
    }

    .product {
      background: rgba(18, 18, 18, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      overflow: hidden;
      backdrop-filter: blur(5px);
    }

    .product img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #222;
    }

    .product-info {
      padding: 12px;
    }

    .product-name {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .price {
      font-weight: bold;
      font-size: 16px;
      color: #febd11;
    }

    .stock {
      color: #aaa;
      font-size: 11px;
      margin-top: 4px;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 30px 20px;
      color: #aaa;
      background: rgba(0, 0, 0, 0.7);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: auto;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <!-- Dark glass layer so text is readable over the flag background -->
  <div class="bg-overlay"></div>

  <!-- Header -->
  <header>
    <div class="logo">Kurd<span>Shein</span></div>

    <div class="search-container">
      <input type="text" id="search-input" placeholder="گەڕان...">
      <button type="button">🔍</button>
    </div>

    <div class="cart">🛒</div>
  </header>

  <!-- Categories -->
  <div class="categories">
    <button class="category active" data-category="all">هەمووی 🛍️</button>
    <button class="category" data-category="new">بابەتی نوێ🔥</button>
    <button class="category">گشتی📦</button>
    <button class="category">ئەکسسوارات💍</button>
    <button class="category">پیاوان🤵🏻‍♂️</button>
    <button class="category">ئافرەتان💁🏼‍♀️</button>
    <button class="category">ئەلکترۆنیات🪫</button>
  </div>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Shop KurdShein</h1>
    <p>نوێترین بەرهەمەکان لێرە دەستبکەوە</p>
  </section>

  <!-- Products Grid -->
  <section class="products">

    <div class="product" data-category="new">
      <img src="./IMG_1707.jpeg" alt="چاویلەی دژە رۆژ">
      <div class="product-info">
        <div class="product-name">چاویلەی دژە رۆژ</div>
        <div class="price">3000 IQD</div>
      </div>
    </div>

    <div class="product">
      <img src="https://placehold.co/600x800/222/fff?text=Product+2" alt="Product 2">
      <div class="product-info">
        <div class="product-name">Product Name</div>
        <div class="price">$15.00</div>
        <div class="stock">Stock: 5</div>
      </div>
    </div>

  </section>

  <!-- Footer -->
  <footer>
    © 2026 KurdShein - سەرجەم مافەکانی پارێزراوە
  </footer>

<script>
// Category Filter Logic
const categoryButtons = document.querySelectorAll('.category');
const products = document.querySelectorAll('.product');

categoryButtons.forEach(button => {
  button.addEventListener('click', () => {
    categoryButtons.forEach(btn => btn.classList.remove('active'));
    button.classList.add('active');

    const category = button.dataset.category;

    products.forEach(product => {
      if (!category || category === 'all') {
        product.style.display = '';
      } else if (category === 'new') {
        product.style.display = product.dataset.category === 'new' ? '' : 'none';
      }
    });
  });
});

// Live Search Bar Logic
const searchInput = document.getElementById('search-input');

searchInput.addEventListener('input', () => {
  const query = searchInput.value.toLowerCase().trim();

  products.forEach(product => {
    const productName = product.querySelector('.product-name').textContent.toLowerCase();
    
    if (productName.includes(query)) {
      product.style.display = '';
    } else {
      product.style.display = 'none';
    }
  });
});
</script>
</body>
</html>
