<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KurdShein</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .top-banner {
      background: #111;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      border-bottom: 1px solid #333;
    }

    .flag {
      margin-right: 8px;
    }

    header {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .cart {
      font-size: 24px;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 15px;
      border-bottom: 1px solid #222;
    }

    .category {
      background: #1a1a1a;
      color: white;
      border: 1px solid #333;
      padding: 10px 18px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
    }

    .category:hover {
      background: white;
      color: black;
    }

    .hero {
      padding: 35px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #aaa;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 15px;
    }

    .product {
      background: #111;
      border: 1px solid #222;
      overflow: hidden;
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #222;
    }

    .product-info {
      padding: 12px;
    }

    .product-name {
      font-size: 15px;
      margin-bottom: 8px;
    }

    .price {
      font-weight: bold;
      font-size: 17px;
    }

    .stock {
      color: #999;
      font-size: 12px;
      margin-top: 5px;
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: #777;
      border-top: 1px solid #222;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="top-banner">
    <span class="flag">🇹🇯</span>
    Welcome to KurdShein
  </div>

  <header>
    <div class="logo">KurdShein</div>
    <div class="cart">🛒</div>
  </header>

  <div class="categories">
    <button class="category">بابەتی نوێ🔥</button>
    <button class="category">گشتی📦</button>
    <button class="category">ئەکسسوارات💍</button>
    <button class="category">پیاوان🤵🏻‍♂️</button>
    <button class="category">ئافرەتان💁🏼‍♀️</button>
    <button class="category">ئەلکترۆنیات🪫</button>
  </div>

  <section class="hero">
    <h1>Shop KurdShein</h1>
    <p>Discover our latest products</p>
  </section>

  <section class="products">

    <div class="product">
      <img src="https://placehold.co/600x800/222/fff?text=Product+1">
      <div class="product-info">
        <div class="product-name">Product Name</div>
        <div class="price">$10.00</div>
        <div class="stock">Stock: 10</div>
      </div>
    </div>

    <div class="product">
      <img src="https://placehold.co/600x800/222/fff?text=Product+2">
      <div class="product-info">
        <div class="product-name">Product Name</div>
        <div class="price">$15.00</div>
        <div class="stock">Stock: 5</div>
      </div>
    </div>

  </section>

  <footer>
    © 2026 KurdShein
  </footer>

</body>
</html>
