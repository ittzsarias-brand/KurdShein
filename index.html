<!DOCTYPE html>
<html lang="kmr" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KurdShein | کوردشین</title>

  <style>
    @font-face {
      font-family: 'Rabar';
      src: url('./Rabar_037.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #09090b;
      color: #ffffff;
      font-family: 'Rabar', sans-serif;
      font-weight: 700;
    }

    /* --- Kurdish Flag Top Strip --- */
    .kurdish-strip {
      display: flex;
      height: 6px;
      width: 100%;
    }
    .strip-red { background: #e41e26; flex: 1; }
    .strip-white { background: #ffffff; flex: 1; }
    .strip-yellow { background: #febd11; flex: 0.5; }
    .strip-white2 { background: #ffffff; flex: 1; }
    .strip-green { background: #278e43; flex: 1; }

    /* Top Announcement Bar */
    .top-banner {
      background: #121215;
      padding: 8px 15px;
      text-align: center;
      font-size: 13px;
      border-bottom: 1px solid #22222a;
      color: #e4e4e7;
    }

    .top-banner span {
      color: #febd11;
    }

    /* Main Navigation Header */
    header {
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #121215;
      border-bottom: 1px solid #27272a;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    /* Logo with Kurdish Red Accent */
    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: #e41e26;
    }

    /* Cart Icon */
    .cart {
      font-size: 22px;
      cursor: pointer;
      background: #18181b;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid #27272a;
    }

    /* Search Bar Styling */
    .search-container {
      display: flex;
      align-items: center;
      flex-grow: 1;
      max-width: 350px;
      margin: 0 12px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 25px;
      padding: 4px 6px 4px 14px;
      transition: border-color 0.2s;
    }

    .search-container:focus-within {
      border-color: #febd11;
    }

    .search-container input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      text-align: right;
    }

    .search-container input::placeholder {
      color: #71717a;
    }

    .search-container button {
      background: #e41e26;
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      flex-shrink: 0;
    }

    /* Horizontal Category Scroll Bar */
    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 14px 18px;
      background: #09090b;
      border-bottom: 1px solid #18181b;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      background: #18181b;
      color: #a1a1aa;
      border: 1px solid #27272a;
      padding: 8px 16px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .category:hover, .category.active {
      background: #278e43;
      border-color: #278e43;
      color: #ffffff;
    }

    /* Hero Section with Kurdish Sun Motif */
    .hero {
      padding: 35px 20px;
      text-align: center;
      background: radial-gradient(circle at top, #241c07 0%, #09090b 80%);
      border-bottom: 1px solid #18181b;
    }

    .sun-badge {
      display: inline-block;
      font-size: 32px;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 10px rgba(254, 189, 17, 0.5));
    }

    .hero h1 {
      font-size: 28px;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .hero p {
      color: #febd11;
      font-size: 14px;
    }

    /* Products Grid */
    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 16px;
    }

    .product {
      background: #121215;
      border: 1px solid #27272a;
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .product:hover {
      border-color: #febd11;
      transform: translateY(-3px);
    }

    .product img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      background: #18181b;
    }

    .product-info {
      padding: 12px;
    }

    .product-name {
      font-size: 14px;
      margin-bottom: 8px;
      color: #f4f4f5;
    }

    .price {
      font-weight: 800;
      font-size: 16px;
      color: #278e43;
    }

    .stock {
      color: #71717a;
      font-size: 12px;
      margin-top: 4px;
    }

    /* Footer Section */
    footer {
      text-align: center;
      padding: 35px 20px;
      color: #71717a;
      background: #121215;
      border-top: 1px solid #27272a;
      margin-top: 30px;
      font-size: 13px;
    }

    .footer-sun {
      color: #febd11;
      font-size: 20px;
      margin-bottom: 8px;
    }

    @media (max-width: 500px) {
      header {
        padding: 10px 12px;
      }
      .logo {
        font-size: 20px;
      }
      .search-container {
        margin: 0 6px;
      }
    }
  </style>
</head>

<body>

  <!-- Kurdish Flag Top Bar -->
  <div class="kurdish-strip">
    <div class="strip-red"></div>
    <div class="strip-white"></div>
    <div class="strip-yellow"></div>
    <div class="strip-white2"></div>
    <div class="strip-green"></div>
  </div>

  <!-- Announcement Bar -->
  <div class="top-banner">
    بەخێربێن بۆ فرۆشگای <span>کوردشین</span> ☀️
  </div>

  <!-- Header -->
  <header>
    <div class="logo">Kurd<span>Shein</span></div>

    <!-- Search Bar in Header -->
    <div class="search-container">
      <input type="text" id="search-input" placeholder="گەڕان...">
      <button type="button">🔍</button>
    </div>

    <div class="cart">🛒</div>
  </header>

  <!-- Categories -->
  <div class="categories">
    <button class="category active" data-category="all">هەمووی 🛍️</button>
    <button class="category" data-category="new">بابەتی نوێ🔥</button>
    <button class="category">گشتی📦</button>
    <button class="category">ئەکسسوارات💍</button>
    <button class="category">پیاوان🤵🏻‍♂️</button>
    <button class="category">ئافرەتان💁🏼‍♀️</button>
    <button class="category">ئەلکترۆنیات🪫</button>
  </div>

  <!-- Hero Section -->
  <section class="hero">
    <div class="sun-badge">☀️</div>
    <h1>Shop KurdShein</h1>
    <p>باشترین و نوێترین بەرهەمەکانی لێرە ببینە</p>
  </section>

  <!-- Products Container -->
  <section class="products">

    <div class="product" data-category="new">
      <img src="./IMG_1707.jpeg" alt="چاویلەی دژە رۆژ">
      <div class="product-info">
        <div class="product-name">چاویلەی دژە رۆژ</div>
        <div class="price">3000 IQD</div>
      </div>
    </div>

    <div class="product">
      <img src="https://placehold.co/600x800/222/fff?text=Product+2" alt="Product 2">
      <div class="product-info">
        <div class="product-name">Product Name</div>
        <div class="price">$15.00</div>
        <div class="stock">Stock: 5</div>
      </div>
    </div>

  </section>

  <!-- Footer -->
  <footer>
    <div class="footer-sun">☀️</div>
    <p>© 2026 KurdShein. هەموو مافەکانی پارێزراوە.</p>
  </footer>

<script>
// Category Filter Function
const categoryButtons = document.querySelectorAll('.category');
const products = document.querySelectorAll('.product');

categoryButtons.forEach(button => {
  button.addEventListener('click', () => {
    categoryButtons.forEach(btn => btn.classList.remove('active'));
    button.classList.add('active');

    const category = button.dataset.category;

    products.forEach(product => {
      if (!category || category === 'all') {
        product.style.display = '';
      } else if (category === 'new') {
        product.style.display = product.dataset.category === 'new' ? '' : 'none';
      }
    });
  });
});

// Live Search Filter Function
const searchInput = document.getElementById('search-input');

searchInput.addEventListener('input', () => {
  const query = searchInput.value.toLowerCase().trim();

  products.forEach(product => {
    const productName = product.querySelector('.product-name').textContent.toLowerCase();
    
    if (productName.includes(query)) {
      product.style.display = '';
    } else {
      product.style.display = 'none';
    }
  });
});
</script>
</body>
</html>
