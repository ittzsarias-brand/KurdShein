<!DOCTYPE html>
<html lang="kmr" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KurdShein | کوردشین</title>

  <style>
    @font-face {
      font-family: 'Rabar';
      src: url('./Rabar_037.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --kurdish-red: #e41e26;
      --kurdish-green: #278e43;
      --kurdish-sun: #febd11;
      --bg-dark: #0a0a0c;
      --card-bg: #141418;
      --border-color: #22222a;
    }

    body {
      background: var(--bg-dark);
      color: #ffffff;
      font-family: 'Rabar', sans-serif;
      font-weight: 700;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Kurdish Flag Ribbon */
    .flag-header {
      display: flex;
      height: 4px;
      width: 100%;
    }
    .flag-red { background: var(--kurdish-red); flex: 1; }
    .flag-white { background: #ffffff; flex: 1; }
    .flag-green { background: var(--kurdish-green); flex: 1; }

    /* Sticky Navigation Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(20, 20, 24, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo .sun {
      color: var(--kurdish-sun);
      font-size: 20px;
    }

    .logo span {
      color: var(--kurdish-red);
    }

    /* Integrated Modern Search Bar */
    .search-wrapper {
      position: relative;
      flex-grow: 1;
      max-width: 320px;
      margin: 0 12px;
    }

    .search-wrapper input {
      width: 100%;
      background: #1c1c22;
      border: 1px solid var(--border-color);
      padding: 8px 14px 8px 36px;
      border-radius: 30px;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
      text-align: right;
    }

    .search-wrapper input:focus {
      border-color: var(--kurdish-sun);
      box-shadow: 0 0 10px rgba(254, 189, 17, 0.2);
    }

    .search-wrapper .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      pointer-events: none;
      opacity: 0.7;
    }

    .cart-btn {
      background: #1c1c22;
      border: 1px solid var(--border-color);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }

    /* Floating Category Chips */
    .categories-wrapper {
      padding: 15px 20px;
      overflow-x: auto;
      white-space: nowrap;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
      background: #0e0e12;
    }

    .categories-wrapper::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      background: #1c1c22;
      color: #a0a0ab;
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .category-btn:hover, .category-btn.active {
      background: var(--kurdish-green);
      border-color: var(--kurdish-green);
      color: #fff;
    }

    /* Hero Banner Area */
    .hero-banner {
      margin: 15px 20px 0;
      padding: 30px 20px;
      background: linear-gradient(135deg, #181409 0%, #0e0e12 100%);
      border: 1px solid rgba(254, 189, 17, 0.15);
      border-radius: 16px;
      text-align: center;
    }

    .hero-banner h1 {
      font-size: 26px;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .hero-banner p {
      color: var(--kurdish-sun);
      font-size: 14px;
    }

    /* Product Grid Layout */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 20px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .product-card:hover {
      transform: translateY(-2px);
      border-color: var(--kurdish-sun);
    }

    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #1a1a20;
    }

    .product-details {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .product-title {
      font-size: 14px;
      color: #f0f0f5;
    }

    .product-price {
      font-size: 15px;
      color: var(--kurdish-green);
      font-weight: 800;
    }

    .product-stock {
      font-size: 11px;
      color: #80808e;
    }

    /* Custom Kurdish Footer */
    footer {
      margin-top: auto;
      padding: 30px 20px;
      background: #0e0e12;
      border-top: 1px solid var(--border-color);
      text-align: center;
      color: #666675;
      font-size: 12px;
    }

    .footer-sun {
      font-size: 22px;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

  <!-- Kurdish Flag Accent Strip -->
  <div class="flag-header">
    <div class="flag-red"></div>
    <div class="flag-white"></div>
    <div class="flag-green"></div>
  </div>

  <!-- Header -->
  <header>
    <div class="logo">
      <span class="sun">☀️</span> Kurd<span>Shein</span>
    </div>

    <div class="search-wrapper">
      <input type="text" id="search-input" placeholder="گەڕان...">
      <span class="search-icon">🔍</span>
    </div>

    <div class="cart-btn">🛒</div>
  </header>

  <!-- Categories Scrollbar -->
  <div class="categories-wrapper">
    <button class="category-btn active" data-category="all">هەمووی 🛍️</button>
    <button class="category-btn" data-category="new">بابەتی نوێ🔥</button>
    <button class="category-btn">گشتی📦</button>
    <button class="category-btn">ئەکسسوارات💍</button>
    <button class="category-btn">پیاوان🤵🏻‍♂️</button>
    <button class="category-btn">ئافرەتان💁🏼‍♀️</button>
    <button class="category-btn">ئەلکترۆنیات🪫</button>
  </div>

  <!-- Hero Section -->
  <div class="hero-banner">
    <h1>Shop KurdShein</h1>
    <p>نوێترین بەرهەمەکان لێرە دەستبکەوە</p>
  </div>

  <!-- Products Grid -->
  <section class="products-grid">

    <div class="product-card" data-category="new">
      <img src="./IMG_1707.jpeg" alt="چاویلەی دژە رۆژ">
      <div class="product-details">
        <div class="product-title">چاویلەی دژە رۆژ</div>
        <div class="product-price">3000 IQD</div>
      </div>
    </div>

    <div class="product-card">
      <img src="https://placehold.co/600x800/222/fff?text=Product+2" alt="Product 2">
      <div class="product-details">
        <div class="product-title">Product Name</div>
        <div class="product-price">$15.00</div>
        <div class="product-stock">Stock: 5</div>
      </div>
    </div>

  </section>

  <!-- Footer -->
  <footer>
    <div class="footer-sun">☀️</div>
    <p>© 2026 KurdShein - هەموو مافەکانی پارێزراوە</p>
  </footer>

<script>
// Category Filter Logic
const categoryButtons = document.querySelectorAll('.category-btn');
const products = document.querySelectorAll('.product-card');

categoryButtons.forEach(button => {
  button.addEventListener('click', () => {
    categoryButtons.forEach(btn => btn.classList.remove('active'));
    button.classList.add('active');

    const category = button.dataset.category;

    products.forEach(product => {
      if (!category || category === 'all') {
        product.style.display = '';
      } else if (category === 'new') {
        product.style.display = product.dataset.category === 'new' ? '' : 'none';
      }
    });
  });
});

// Search Bar Filter Logic
const searchInput = document.getElementById('search-input');

searchInput.addEventListener('input', () => {
  const query = searchInput.value.toLowerCase().trim();

  products.forEach(product => {
    const productName = product.querySelector('.product-title').textContent.toLowerCase();
    
    if (productName.includes(query)) {
      product.style.display = '';
    } else {
      product.style.display = 'none';
    }
  });
});
</script>
</body>
</html>
